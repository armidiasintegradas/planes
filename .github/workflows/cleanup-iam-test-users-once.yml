name: Cleanup Planes IAM test users once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-iam-test-users-once.yml

permissions:
  contents: read

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cleanup IAM test users
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            -d '{}' \
            'https://xfgcbxppsbwmxwsuajou.supabase.co/functions/v1/cleanup-iam-test-users-once'
