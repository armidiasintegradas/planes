name: Safe Planes profile and login repair
on:
  push:
    branches: [gh-pages]
    paths:
      - scripts/patch-profile-auth-separation.py
      - .github/workflows/profile-login-repair.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: planes-profile-login-repair
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch exact legacy profile handler
        run: python3 scripts/patch-profile-auth-separation.py
      - name: Verify separate operations, production account protection, and login
        shell: bash
        run: |
          node --check auth-gate-live.js
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const login=fs.readFileSync('auth-gate-live.js','utf8');
          const start=html.indexOf('    async function handleChangeProfilePassword() {');
          const email=html.indexOf('    async function handleChangeProfileEmail() {',start);
          const profile=html.indexOf('    async function handleSaveProfile() {',email);
          const end=html.indexOf('      // Ambiente local de desenvolvimento: mantém edição local para testes.',profile);
          if(start<0||email<0||profile<0||end<0)throw Error('Required functions missing');
          const functions=html.slice(start,profile);
          new vm.Script(functions);
          const profileSave=html.slice(profile,end);
          if(/auth\.updateUser\(|authChanges|authEmailConfirmed|newPass|passConfirm/.test(profileSave))
            throw Error('Save profile still tries to mutate auth credentials');
          if(/profilePayload\.email\s*=/.test(profileSave))
            throw Error('Save profile updates email before confirmation');
          if(!/await supabaseClient\.auth\.updateUser\(\{password:newPass\}\)/.test(functions))
            throw Error('Separate password action missing');
          if(!/await supabaseClient\.auth\.updateUser\(\{email\}\)/.test(functions))
            throw Error('Separate email action missing');
          if(!/autocomplete="new-password"/.test(html))
            throw Error('Missing password manager hints');
          if(!/Entrar com e-mail e senha/.test(login))
            throw Error('Email-password login not accessible');
          if(!/auth\.signInWithPassword/.test(login))
            throw Error('Existing password login missing');
          if(!/profile\.status !== 'approved'/.test(login))
            throw Error('Approved-only auth gate missing');
          console.log('PASS: separate credentials and profile, valid login, approval gate intact');
          NODE
      - name: Commit inspected index only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "fix(auth): separate profile edits from credential updates"
            git push origin HEAD:gh-pages
          fi
