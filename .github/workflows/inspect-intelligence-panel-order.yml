name: Inspect Intelligence panel order
on:
  push:
    branches: [gh-pages]
    paths: [scripts/inspect-intelligence-panel-order.cjs, .github/workflows/inspect-intelligence-panel-order.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/inspect-intelligence-panel-order.cjs
