name: Publish Planes global layout hotfix

on:
  push:
    branches:
      - main
    paths:
      - public/live-mobile-layout.css
      - .github/workflows/publish-live-mobile-layout.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: planes-live-layout-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: main
          path: source

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Validate source before publication
        working-directory: source
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Validate global layout CSS contract
        working-directory: source
        run: |
          set -euo pipefail
          test -s public/live-mobile-layout.css
          grep -q 'table td \[class~="rounded-full"\]\[class\*="emerald"\]' public/live-mobile-layout.css
          grep -q 'display: inline-flex !important' public/live-mobile-layout.css
          grep -q 'white-space: nowrap !important' public/live-mobile-layout.css
          grep -q 'flex-wrap: nowrap !important' public/live-mobile-layout.css
          grep -q 'overflow-wrap: normal !important' public/live-mobile-layout.css
          grep -q '^#toast {' public/live-mobile-layout.css
          grep -q 'top: auto !important' public/live-mobile-layout.css
          grep -q 'bottom: max(1rem, env(safe-area-inset-bottom, 0px)) !important' public/live-mobile-layout.css
          grep -q '@media (max-width: 1023px)' public/live-mobile-layout.css
          grep -q '@media (max-width: 420px)' public/live-mobile-layout.css

      - name: Checkout current GitHub Pages artifact
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site

      - name: Copy global layout stylesheet
        run: |
          set -euo pipefail
          cp source/public/live-mobile-layout.css site/live-mobile-layout.css

      - name: Inject stylesheet without replacing current site
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path('site/index.html')
          html = path.read_text(encoding='utf-8')
          start = '<!-- PLANES_MOBILE_LAYOUT_START -->'
          end = '<!-- PLANES_MOBILE_LAYOUT_END -->'

          html = re.sub(re.escape(start) + r'.*?' + re.escape(end), '', html, flags=re.S)
          version = os.environ.get('SOURCE_SHA', 'global-layout')[:12]
          block = f'''{start}\n<link rel="stylesheet" href="./live-mobile-layout.css?v={version}" />\n{end}'''

          if '</head>' not in html:
              raise SystemExit('index.html has no </head> marker; refusing to publish')

          html = html.replace('</head>', block + '\n</head>', 1)

          if html.count(start) != 1 or html.count(end) != 1:
              raise SystemExit('layout marker count is not exactly one')
          if './live-mobile-layout.css?v=' not in html:
              raise SystemExit('layout stylesheet reference missing after patch')

          path.write_text(html, encoding='utf-8')
          PY

      - name: Verify production artifact integrity
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/live-mobile-layout.css
          test "$(grep -o 'PLANES_MOBILE_LAYOUT_START' site/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'PLANES_MOBILE_LAYOUT_END' site/index.html | wc -l | tr -d ' ')" = "1"
          grep -q 'live-mobile-layout.css?v=' site/index.html
          grep -q '^#toast {' site/live-mobile-layout.css
          grep -q 'top: auto !important' site/live-mobile-layout.css

      - name: Publish to gh-pages
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html live-mobile-layout.css
          if git diff --cached --quiet; then
            echo "No Pages changes to publish."
            exit 0
          fi
          git commit -m "fix: publish global responsive layout guardrails"
          git push origin HEAD:gh-pages
