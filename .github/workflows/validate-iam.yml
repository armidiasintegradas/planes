name: Validate Planes IAM

on:
  push:
    branches:
      - feat/planes-iam-real
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: package-lock.json
        continue-on-error: true

      - name: Install dependencies and create lockfile
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit lockfile when generated
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock IAM dependencies [skip ci]"
            git push
          fi
