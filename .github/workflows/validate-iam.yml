name: Validate Planes IAM

on:
  push:
    branches:
      - feat/planes-iam-real
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      isolated-postgres:
        image: postgres:16
        env:
          POSTGRES_DB: planes_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: planes_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d planes_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test auth security
        run: npm test

      - name: Exercise isolated PostgreSQL RLS matrix with synthetic identities
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: planes_ci_only
          PGDATABASE: planes_ci
        run: |
          set -euo pipefail
          psql --version
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/intelligence-rls-isolated.sql

      - name: Exercise isolated PostgREST HTTP with synthetic JWT users
        env:
          PLANES_ISOLATED_API: http://127.0.0.1:3333
          PLANES_ISOLATED_JWT_SECRET: planes-ci-jwt-secret-not-for-any-real-environment-2026
        run: |
          set -euo pipefail
          docker run --rm -d --name planes-intelligence-pgrst-test --network host \
            -e PGRST_DB_URI="postgres://authenticator:planes_http_test_only@127.0.0.1:5432/planes_ci" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$PLANES_ISOLATED_JWT_SECRET" \
            -e PGRST_SERVER_PORT=3333 \
            postgrest/postgrest:v14.18 >/dev/null
          cleanup() {
            code=$?
            if [ "$code" != 0 ]; then docker logs planes-intelligence-pgrst-test || true; fi
            docker rm -f planes-intelligence-pgrst-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          started=0
          for attempt in {1..60}; do
            status=$(curl -s --max-time 2 -o /dev/null -w '%{http_code}'               "http://127.0.0.1:3333/projects?select=code" || true)
            if [ "$status" = 401 ] || [ "$status" = 403 ] || [ "$status" = 200 ]; then
              started=1
              break
            fi
            sleep 1
          done
          if [ "$started" != 1 ]; then
            echo "PostgREST schema cache did not become ready"
            exit 1
          fi
          node tests/http-intelligence-rls-e2e.mjs

      - name: Build
        run: npm run build

      - name: Verify isolated auth preview
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors \
            https://armidiasintegradas.github.io/planes/auth-preview.html \
            | grep -q "PLANES OS · HOMOLOGAÇÃO IAM"
