name: Validate Planes IAM

on:
  push:
    branches:
      - feat/planes-iam-real
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      isolated-postgres:
        image: postgres:16
        env:
          POSTGRES_DB: planes_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: planes_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d planes_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test auth security
        run: npm test

      - name: Exercise isolated PostgreSQL RLS matrix with synthetic identities
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: planes_ci_only
          PGDATABASE: planes_ci
        run: |
          set -euo pipefail
          psql --version
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/intelligence-rls-isolated.sql

      - name: Build
        run: npm run build

      - name: Verify isolated auth preview
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors \
            https://armidiasintegradas.github.io/planes/auth-preview.html \
            | grep -q "PLANES OS · HOMOLOGAÇÃO IAM"
