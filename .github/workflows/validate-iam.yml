name: Validate Planes IAM

on:
  push:
    branches:
      - feat/planes-iam-real
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify isolated auth preview
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors \
            https://armidiasintegradas.github.io/planes/auth-preview.html \
            | grep -q "PLANES OS · HOMOLOGAÇÃO IAM"
