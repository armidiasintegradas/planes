name: Publish Planes live auth
# Publishes the current auth runtime and PWA shell atomically.

on:
  push:
    branches:
      - main
    paths:
      - public/auth-gate-live.js
      - public/email-lifecycle-kick-live.js
      - public/legacy-auth-sanitizer-live.js
      - sw.js
      - .github/workflows/publish-live-auth.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: planes-live-auth-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout authenticated source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Validate source before publication
        working-directory: source
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Checkout current GitHub Pages artifact
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Copy production auth modules
        run: |
          set -euo pipefail
          cp source/public/auth-gate-live.js site/auth-gate-live.js
          cp source/public/email-lifecycle-kick-live.js site/email-lifecycle-kick-live.js
          cp source/public/legacy-auth-sanitizer-live.js site/legacy-auth-sanitizer-live.js
          cp source/sw.js site/sw.js

      - name: Inject auth bootstrap without replacing current site
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path('site/index.html')
          html = path.read_text(encoding='utf-8')
          start = '<!-- PLANES_AUTH_GATE_START -->'
          end = '<!-- PLANES_AUTH_GATE_END -->'

          existing = re.compile(re.escape(start) + r'.*?' + re.escape(end), re.S)
          html = existing.sub('', html)

          version = os.environ.get('SOURCE_SHA', 'live-auth')[:12]
          block = f'''{start}
          <style id="planes-auth-bootstrap">
            html.planes-auth-loading body{{visibility:hidden!important}}
            html.planes-auth-blocked body{{visibility:visible!important}}
            html.planes-auth-blocked body>*:not(#planes-auth-root){{visibility:hidden!important;pointer-events:none!important}}
            html.planes-auth-blocked #planes-auth-root{{visibility:visible!important;pointer-events:auto!important}}
          </style>
          <script>document.documentElement.classList.add('planes-auth-loading');</script>
          <script type="module" src="./legacy-auth-sanitizer-live.js?v={version}"></script>
          <script type="module" src="./auth-gate-live.js?v={version}"></script>
          <script type="module" src="./email-lifecycle-kick-live.js?v={version}"></script>
          {end}'''

          if '</head>' not in html:
              raise SystemExit('index.html has no </head> marker; refusing to publish')

          html = html.replace('</head>', block + '\n</head>', 1)

          if html.count(start) != 1 or html.count(end) != 1:
              raise SystemExit('auth bootstrap marker count is not exactly one')
          if './legacy-auth-sanitizer-live.js?v=' not in html:
              raise SystemExit('legacy auth sanitizer reference missing after patch')
          if './auth-gate-live.js?v=' not in html:
              raise SystemExit('auth module reference missing after patch')
          if './email-lifecycle-kick-live.js?v=' not in html:
              raise SystemExit('email lifecycle module reference missing after patch')

          legacy_pwa = re.compile(
              r"\s*// Limpa imediatamente caches antigos da thread principal\s*"
              r"if \('caches' in window\) \{.*?"
              r"navigator\.serviceWorker\.register\('\./sw\.js\?v=\d+'\)\.then\(reg => \{"
              r"\s*reg\.update\(\);"
              r"\s*\}\)\.catch\(\(\) => \{\}\);"
              r"\s*\}\);"
              r"\s*\}",
              re.S,
          )
          pwa_v14 = '''
          // PWA v14: o Service Worker gerencia a expiração dos caches antigos.
          // Não apagar caches manualmente aqui; isso causava conflito com o SW ativo no iOS.
          if ('serviceWorker' in navigator) {
            let planesSwReloaded = false;

            navigator.serviceWorker.addEventListener('controllerchange', () => {
              if (planesSwReloaded) return;
              planesSwReloaded = true;
              window.location.reload();
            });

            window.addEventListener('load', () => {
              navigator.serviceWorker.register('./sw.js?v=14').then(reg => {
                reg.update();
              }).catch(() => {});
            });
          }'''

          html, pwa_replacements = legacy_pwa.subn('\n' + pwa_v14, html, count=1)

          # Upgrade already-modern shells from v13 to v14 as well.
          html = html.replace('./sw.js?v=13', './sw.js?v=14')
          html = html.replace('PWA v13:', 'PWA v14:')

          if "./sw.js?v=14" not in html:
              raise SystemExit('PWA bootstrap is not v14; refusing to publish')

          # Expose the native runtime hydrator so the auth gate can call it directly.
          # Keep this transformation idempotent because gh-pages may already be patched.
          html = html.replace(
              "window.applySupabaseAuthPayload = window.applySupabaseAuthPayload = function applySupabaseAuthPayload",
              "window.applySupabaseAuthPayload = function applySupabaseAuthPayload",
          )
          html = html.replace(
              "window.window.applySupabaseAuthPayload(",
              "window.applySupabaseAuthPayload(",
          )

          if "window.applySupabaseAuthPayload = function applySupabaseAuthPayload" not in html:
              html = html.replace(
                  "function applySupabaseAuthPayload(payload = window.__PLANES_AUTH_BRIDGE_PAYLOAD__) {",
                  "window.applySupabaseAuthPayload = function applySupabaseAuthPayload(payload = window.__PLANES_AUTH_BRIDGE_PAYLOAD__) {",
                  1,
              )

          if "window.applySupabaseAuthPayload(event.detail || window.__PLANES_AUTH_BRIDGE_PAYLOAD__);" not in html:
              html = html.replace(
                  "applySupabaseAuthPayload(event.detail || window.__PLANES_AUTH_BRIDGE_PAYLOAD__);",
                  "window.applySupabaseAuthPayload(event.detail || window.__PLANES_AUTH_BRIDGE_PAYLOAD__);",
                  1,
              )

          if "if (!window.applySupabaseAuthPayload()) render();" not in html:
              html = html.replace(
                  "if (!applySupabaseAuthPayload()) render();",
                  "if (!window.applySupabaseAuthPayload()) render();",
                  1,
              )

          if "window.applySupabaseAuthPayload = function applySupabaseAuthPayload" not in html:
              raise SystemExit('native runtime hydrator was not exposed')
          if "window.window.applySupabaseAuthPayload" in html:
              raise SystemExit('invalid double-window runtime hydrator reference')

          # Keep the runtime hydrator idempotent for repeated auth events.
          old_guard = "if (!payload || !payload.user || window.__PLANES_AUTH_INTERNAL_APPLIED__) return false;"
          new_guard = "if (!payload || !payload.user) return false;\n\n      const targetUserId = payload.user.auth_user_id || payload.user.id || null;\n      if (\n        window.__PLANES_AUTH_INTERNAL_APPLIED__ &&\n        window.__PLANES_AUTH_APPLIED_USER_ID__ === targetUserId\n      ) {\n        window.__PLANES_AUTH_HYDRATED__ = true;\n        return true;\n      }"
          html = html.replace(old_guard, new_guard, 1)

          old_flags = "window.__PLANES_AUTH_INTERNAL_APPLIED__ = true;\n        window.__PLANES_AUTH_HYDRATED__ = true;"
          new_flags = "window.__PLANES_AUTH_INTERNAL_APPLIED__ = true;\n        window.__PLANES_AUTH_APPLIED_USER_ID__ = targetUserId;\n        window.__PLANES_AUTH_HYDRATED__ = true;"
          html = html.replace(old_flags, new_flags, 1)

          if "__PLANES_AUTH_APPLIED_USER_ID__" not in html:
              raise SystemExit('runtime hydrator idempotency marker missing')

          runtime_start = '<!-- PLANES_AUTH_RUNTIME_BRIDGE_START -->'
          runtime_end = '<!-- PLANES_AUTH_RUNTIME_BRIDGE_END -->'
          runtime_existing = re.compile(re.escape(runtime_start) + r'.*?' + re.escape(runtime_end), re.S)
          html = runtime_existing.sub('', html)

          # Production must use only the native runtime hydrator.
          html = re.sub(
              r'\s*<script[^>]+auth-runtime-bridge-live\.js[^>]*></script>\s*',
              '\n',
              html,
              flags=re.I,
          )

          if 'auth-runtime-bridge-live.js' in html:
              raise SystemExit('external runtime bridge reference still present')

          path.write_text(html, encoding='utf-8')
          PY

      - name: Verify production artifact integrity
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/auth-gate-live.js
          test -s site/email-lifecycle-kick-live.js
          test -s site/legacy-auth-sanitizer-live.js
          test -s site/sw.js
          test "$(grep -o 'PLANES_AUTH_GATE_START' site/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'PLANES_AUTH_GATE_END' site/index.html | wc -l | tr -d ' ')" = "1"
          grep -q 'legacy-auth-sanitizer-live.js?v=' site/index.html
          grep -q 'auth-gate-live.js?v=' site/index.html
          ! grep -q 'auth-runtime-bridge-live.js' site/index.html
          grep -q "sw.js?v=14" site/index.html
          grep -q 'controllerchange' site/index.html
          grep -q 'window.applySupabaseAuthPayload = function applySupabaseAuthPayload' site/index.html
          grep -q 'email-lifecycle-kick-live.js?v=' site/index.html
          grep -q 'data-planes-legacy-auth-disabled' site/legacy-auth-sanitizer-live.js
          grep -q 'planes-email-worker' site/email-lifecycle-kick-live.js
          grep -q "planes-os-v14" site/sw.js
          grep -q 'signInWithOAuth' site/auth-gate-live.js
          grep -q "provider: 'google'" site/auth-gate-live.js
          grep -q 'signInWithPassword' site/auth-gate-live.js
          grep -q 'signInWithPasskey' site/auth-gate-live.js
          grep -q 'registerPasskey' site/auth-gate-live.js
          grep -q 'passkeys_enabled' site/auth-gate-live.js

      - name: Publish to gh-pages
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html auth-gate-live.js email-lifecycle-kick-live.js legacy-auth-sanitizer-live.js sw.js
          if git diff --cached --quiet; then
            echo "No Pages changes to publish."
            exit 0
          fi
          git commit -m "fix: keep Planes authentication single-source"
          git push origin HEAD:gh-pages
