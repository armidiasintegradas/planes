name: Publish Planes live auth
# consolidated-v17
# Consolidated single-owner auth publisher.
# Unified OAuth validation retry.
# validated-2026-09-23-green

on:
  push:
    branches: [main]
    paths:
      - public/auth-gate-live.js
      - public/email-lifecycle-kick-live.js
      - public/legacy-auth-sanitizer-live.js
      - index.html
      - sw.js
      - .github/workflows/publish-live-auth.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: planes-live-auth-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Validate source
        working-directory: source
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Update live auth artifacts
        run: |
          set -euo pipefail
          cp source/public/auth-gate-live.js site/auth-gate-live.js
          cp source/public/email-lifecycle-kick-live.js site/email-lifecycle-kick-live.js
          cp source/public/legacy-auth-sanitizer-live.js site/legacy-auth-sanitizer-live.js
          cp source/sw.js site/sw.js

      - name: Sync native auth runtime hydrator
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('source/index.html')
          site_path = Path('site/index.html')
          source = source_path.read_text(encoding='utf-8')
          site = site_path.read_text(encoding='utf-8')

          start_marker = "window.applySupabaseAuthPayload = function applySupabaseAuthPayload"
          end_marker = "window.addEventListener('planes-auth-payload-ready'"

          source_start = source.find(start_marker)
          source_end = source.find(end_marker, source_start)
          site_start = site.find(start_marker)
          site_end = site.find(end_marker, site_start)

          if min(source_start, source_end, site_start, site_end) < 0:
              raise SystemExit('Could not locate native auth hydrator boundaries')

          hydrated_block = source[source_start:source_end]
          site = site[:site_start] + hydrated_block + site[site_end:]

          import re
          site, sw_refs = re.subn(
              r"serviceWorker\.register\('\./sw\.js\?v=\d+'\)",
              "serviceWorker.register('./sw.js?v=17')",
              site
          )

          site, auth_refs = re.subn(
              r"((?:legacy-auth-sanitizer-live|auth-gate-live|email-lifecycle-kick-live)\\.js)\\?v=[^\\\"']+",
              r"\\1?v=17-auth",
              site
          )
          if auth_refs not in (0, 3):
              raise SystemExit(f'Unexpected partial live auth module refs: {auth_refs}')

          site_path.write_text(site, encoding='utf-8')
          PY

      - name: Verify published shell contract
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/auth-gate-live.js
          test -s site/sw.js

          grep -q 'window.applySupabaseAuthPayload = function applySupabaseAuthPayload' site/index.html
          grep -q 'const externalAuthOwnsSession = window.__PLANES_EXTERNAL_AUTH_OWNER__ === true;' site/index.html
          grep -q 'if (supabaseClient && !externalAuthOwnsSession)' site/index.html
          grep -q '__PLANES_AUTH_APPLIED_USER_ID__' site/index.html
          ! grep -q 'auth-runtime-bridge-live.js' site/index.html
          ! grep -q 'window.window.applySupabaseAuthPayload' site/index.html

          grep -q "flowType: 'implicit'" site/auth-gate-live.js
          grep -q 'supabase.auth.setSession' site/auth-gate-live.js
          grep -q 'Authorization: `Bearer ${accessToken}`' site/auth-gate-live.js
          grep -q "planes-os-v17" site/sw.js

          auth_ref_count="$(grep -o '?v=17-auth' site/index.html | wc -l || true)"
          test "$auth_ref_count" -eq 0 -o "$auth_ref_count" -eq 3

          if grep -q "serviceWorker.register('./sw.js?v=" site/index.html; then
            grep -q "sw.js?v=17" site/index.html
          fi

      - name: Publish to gh-pages
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html auth-gate-live.js email-lifecycle-kick-live.js legacy-auth-sanitizer-live.js sw.js
          if git diff --cached --quiet; then
            echo "No live auth changes to publish."
            exit 0
          fi
          git commit -m "fix: publish validated Planes live auth"
          git push origin HEAD:gh-pages
