name: Update Supabase lockfile once

on:
  push:
    branches:
      - feat/planes-iam-real
    paths:
      - .github/workflows/update-supabase-lock.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/planes-iam-real

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify Supabase version
        run: node -e "const p=require('./package-lock.json'); const v=p.packages['node_modules/@supabase/supabase-js'].version; if(v!=='2.105.0') throw new Error('unexpected '+v); console.log('SUPABASE_LOCK='+v)"

      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: refresh lockfile for Supabase passkeys'
          git push origin HEAD:feat/planes-iam-real
