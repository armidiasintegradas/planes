name: Create Planes IAM reject test user once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-iam-reject-test-user-once.yml

permissions:
  contents: read

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke one-time reject test user creator
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            -d '{}' \
            'https://xfgcbxppsbwmxwsuajou.supabase.co/functions/v1/create-iam-reject-test-user-once'
