name: Inspect legacy chat source
on:
  push:
    branches: [gh-pages]
    paths: [scripts/inspect-legacy-chat.cjs, .github/workflows/inspect-legacy-chat.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/inspect-legacy-chat.cjs
