name: PLANES Production Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Checkout current production shell
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: production-site

      - name: Assemble candidate production artifact
        shell: bash
        run: |
          set -euo pipefail
          cp public/auth-gate-live.js production-site/auth-gate-live.js
          cp public/email-lifecycle-kick-live.js production-site/email-lifecycle-kick-live.js
          cp public/legacy-auth-sanitizer-live.js production-site/legacy-auth-sanitizer-live.js
          cp sw.js production-site/sw.js

          grep -q "Planes" production-site/index.html
          grep -q "hydratePlanesFromSupabase" production-site/auth-gate-live.js
          grep -q "installSecureLogoutBridge" production-site/auth-gate-live.js
          grep -q "planes-auth-payload-ready" production-site/auth-gate-live.js
          grep -q "__PLANES_EXTERNAL_AUTH_OWNER__" production-site/auth-gate-live.js
          grep -q "flowType: 'implicit'" production-site/auth-gate-live.js
          grep -q "applySupabaseAuthPayload" production-site/index.html
          grep -q "__PLANES_AUTH_INTERNAL_APPLIED__" production-site/index.html
          grep -q "__PLANES_AUTH_APPLIED_USER_ID__" production-site/index.html
          grep -q "externalAuthOwnsSession" production-site/index.html
          ! grep -q "auth-runtime-bridge-live.js" production-site/index.html
          grep -q "planes-os-v17" production-site/sw.js

          # Realtime voice production contract
          grep -q "input_audio_buffer.speech_started" production-site/index.html
          grep -q "conversation.item.input_audio_transcription.completed" production-site/index.html
          grep -q "response.output_item.done" production-site/index.html
          grep -q "response.function_call_arguments.done" production-site/index.html
          grep -q "conversation.item.create" production-site/index.html
          grep -q "response.create" production-site/index.html
          grep -q "startRealtimeVoiceAssistant(retryAttempt = 0)" production-site/index.html
          grep -q "/functions/v1/planes-voice-tts" production-site/index.html
          grep -q "Reconectando a voz neural" production-site/index.html
          ! grep -q "session.instructions.append" production-site/index.html
          ! grep -q "session.input_transcript.delta" production-site/index.html
          ! grep -q "session.output_transcript.delta" production-site/index.html
          ! grep -q "response.item.create" production-site/index.html

      - name: Smoke test public production shell
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 "https://armidiasintegradas.github.io/planes/?ci=${GITHUB_SHA}" -o /tmp/planes-index.html
          curl -fsSL --retry 3 --retry-delay 2 "https://armidiasintegradas.github.io/planes/auth-gate-live.js?ci=${GITHUB_SHA}" -o /tmp/planes-auth-gate.js
          curl -fsSL --retry 3 --retry-delay 2 "https://armidiasintegradas.github.io/planes/sw.js?ci=${GITHUB_SHA}" -o /tmp/planes-sw.js
          grep -q "Planes" /tmp/planes-index.html
          grep -q "hydratePlanesFromSupabase" /tmp/planes-auth-gate.js
          grep -q "applySupabaseAuthPayload" /tmp/planes-index.html
          grep -q "const CACHE_NAME = 'planes-os-v" /tmp/planes-sw.js
          grep -q "input_audio_buffer.speech_started" /tmp/planes-index.html
          grep -q "conversation.item.input_audio_transcription.completed" /tmp/planes-index.html
          grep -q "/functions/v1/planes-voice-tts" /tmp/planes-index.html

      - name: Validate authenticated runtime hydration in real browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory production-site >/tmp/planes-e2e-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 1
          PLANES_E2E_URL="http://127.0.0.1:4173/" node tests/browser-auth-runtime-e2e.mjs

      - name: Validate live production runtime hydration
        shell: bash
        run: |
          set -euo pipefail
          PLANES_E2E_URL="https://armidiasintegradas.github.io/planes/?live-e2e=${GITHUB_SHA}" node tests/browser-auth-runtime-e2e.mjs

      - name: Diagnose login gate across viewports
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          for size in 390,844 820,1180 1440,900; do
            out="/tmp/planes-$size.html"
            python3 -m http.server 4174 --directory production-site >/tmp/planes-viewport-server.log 2>&1 &
            server_pid=$!
            trap 'kill $server_pid || true' EXIT
            sleep 1
            google-chrome \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --virtual-time-budget=15000 \
              --window-size="$size" \
              --dump-dom \
              "http://127.0.0.1:4174/?viewport=$size" > "$out"
            kill $server_pid || true
            trap - EXIT
            echo "VIEWPORT=$size AUTH_ROOT=$(grep -c 'id=\"planes-auth-root\"' "$out" || true) AUTH_CARD=$(grep -c 'planes-auth-card' "$out" || true) LOGIN=$(grep -c 'Entrar no Planes OS' "$out" || true) INIT=$(grep -c 'Inicializando seu ambiente' "$out" || true)"
            grep -Eo '<h1[^>]*>[^<]*|planes-auth-[a-z-]+' "$out" | head -20 || true
            grep -q 'PLANES OS' "$out"
          done

      - name: Headless authenticated runtime hydration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          payload = """<script>
          window.__PLANES_EXTERNAL_AUTH_OWNER__ = true;
          window.__PLANES_AUTH_BRIDGE_PAYLOAD__ = {
            user: {
              id: 'ci-admin',
              auth_user_id: 'ci-admin',
              name: 'CI Admin',
              email: 'ci-admin@example.com',
              role: 'admin',
              role_id: 'admin',
              level: 'admin',
              status: 'Aprovado',
              avatar: 'CI'
            },
            profile: {
              id: 'ci-admin',
              email: 'ci-admin@example.com',
              role: 'admin',
              status: 'approved'
            }
          };
          </script>"""
          html = html.replace('</head>', payload + '\n</head>', 1)

          probe = """<script>
          (() => {
            let n = 0;
            const check = () => {
              n += 1;
              const hydrated = window.__PLANES_AUTH_HYDRATED__ === true;
              document.documentElement.setAttribute(
                'data-planes-auth-test',
                hydrated ? 'hydrated' : (window.__PLANES_AUTH_LAST_ERROR__ ? 'error' : 'pending')
              );
              if (window.__PLANES_AUTH_LAST_ERROR__) {
                document.documentElement.setAttribute(
                  'data-planes-auth-error',
                  String(window.__PLANES_AUTH_LAST_ERROR__).slice(0, 500)
                );
              }
              if (!hydrated && n < 100) setTimeout(check, 100);
            };
            check();
          })();
          </script>"""
          html = html.replace('</body>', probe + '\n</body>', 1)
          Path('/tmp/planes-auth-test.html').write_text(html, encoding='utf-8')
          PY

          cp /tmp/planes-auth-test.html ./planes-auth-test.html
          python3 -m http.server 8765 >/tmp/planes-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2

          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=20000 \
            --window-size=390,844 \
            --dump-dom \
            http://127.0.0.1:8765/planes-auth-test.html > /tmp/planes-authenticated.html

          grep -q 'data-planes-auth-test="hydrated"' /tmp/planes-authenticated.html || {
            echo 'Authenticated runtime hydration failed'
            grep -o 'data-planes-auth-error="[^"]*"' /tmp/planes-authenticated.html || true
            exit 1
          }

      - name: Run regression tests
        run: npm test

      - name: Report dependency audit
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const rows = Object.entries(audit.vulnerabilities || {}).map(([name, value]) => ({
            name,
            severity: value.severity,
            direct: Boolean(value.isDirect),
            fixAvailable: value.fixAvailable === true
              ? 'yes'
              : value.fixAvailable && typeof value.fixAvailable === 'object'
                ? `${value.fixAvailable.name}@${value.fixAvailable.version}${value.fixAvailable.isSemVerMajor ? ' (major)' : ''}`
                : 'no'
          }));
          console.log('AUDIT_SUMMARY=' + JSON.stringify(rows));
          console.log('AUDIT_METADATA=' + JSON.stringify(audit.metadata?.vulnerabilities || {}));
          NODE
