name: PLANES Production Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Checkout current production shell
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: production-site

      - name: Assemble candidate production artifact
        shell: bash
        run: |
          set -euo pipefail
          cp public/auth-gate-live.js production-site/auth-gate-live.js
          cp public/email-lifecycle-kick-live.js production-site/email-lifecycle-kick-live.js
          cp public/legacy-auth-sanitizer-live.js production-site/legacy-auth-sanitizer-live.js
          cp sw.js production-site/sw.js

          grep -q "Planes" production-site/index.html
          grep -q "hydratePlanesFromSupabase" production-site/auth-gate-live.js
          grep -q "installSecureLogoutBridge" production-site/auth-gate-live.js
          grep -q "planes-auth-payload-ready" production-site/auth-gate-live.js
          grep -q "__PLANES_EXTERNAL_AUTH_OWNER__" production-site/auth-gate-live.js
          grep -q "flowType: 'implicit'" production-site/auth-gate-live.js
          grep -q "applySupabaseAuthPayload" production-site/index.html
          grep -q "__PLANES_AUTH_INTERNAL_APPLIED__" production-site/index.html
          grep -q "__PLANES_AUTH_APPLIED_USER_ID__" production-site/index.html
          grep -q "externalAuthOwnsSession" production-site/index.html
          ! grep -q "auth-runtime-bridge-live.js" production-site/index.html
          grep -q "planes-os-v15" production-site/sw.js

      - name: Smoke test public production shell
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 "https://armidiasintegradas.github.io/planes/?ci=${GITHUB_SHA}" -o /tmp/planes-index.html
          curl -fsSL --retry 3 --retry-delay 2 "https://armidiasintegradas.github.io/planes/auth-gate-live.js?ci=${GITHUB_SHA}" -o /tmp/planes-auth-gate.js
          curl -fsSL --retry 3 --retry-delay 2 "https://armidiasintegradas.github.io/planes/sw.js?ci=${GITHUB_SHA}" -o /tmp/planes-sw.js
          grep -q "Planes" /tmp/planes-index.html
          grep -q "hydratePlanesFromSupabase" /tmp/planes-auth-gate.js
          grep -q "applySupabaseAuthPayload" /tmp/planes-index.html
          grep -q "planes-os-v15" /tmp/planes-sw.js

      - name: Validate authenticated runtime hydration in real browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory production-site >/tmp/planes-e2e-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 1
          PLANES_E2E_URL="http://127.0.0.1:4173/" node tests/browser-auth-runtime-e2e.mjs

      - name: Diagnose login gate across viewports
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          for size in 390,844 820,1180 1440,900; do
            out="/tmp/planes-$size.html"
            python3 -m http.server 4174 --directory production-site >/tmp/planes-viewport-server.log 2>&1 &
            server_pid=$!
            trap 'kill $server_pid || true' EXIT
            sleep 1
            google-chrome \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --virtual-time-budget=15000 \
              --window-size="$size" \
              --dump-dom \
              "http://127.0.0.1:4174/?viewport=$size" > "$out"
            kill $server_pid || true
            trap - EXIT
            echo "VIEWPORT=$size AUTH_ROOT=$(grep -c 'id=\"planes-auth-root\"' "$out" || true) AUTH_CARD=$(grep -c 'planes-auth-card' "$out" || true) LOGIN=$(grep -c 'Entrar no Planes OS' "$out" || true) INIT=$(grep -c 'Inicializando seu ambiente' "$out" || true)"
            grep -Eo '<h1[^>]*>[^<]*|planes-auth-[a-z-]+' "$out" | head -20 || true
            grep -q 'PLANES OS' "$out"
          done

      - name: Run regression tests
        run: npm test

      - name: Report dependency audit
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const rows = Object.entries(audit.vulnerabilities || {}).map(([name, value]) => ({
            name,
            severity: value.severity,
            direct: Boolean(value.isDirect),
            fixAvailable: value.fixAvailable === true
              ? 'yes'
              : value.fixAvailable && typeof value.fixAvailable === 'object'
                ? `${value.fixAvailable.name}@${value.fixAvailable.version}${value.fixAvailable.isSemVerMajor ? ' (major)' : ''}`
                : 'no'
          }));
          console.log('AUDIT_SUMMARY=' + JSON.stringify(rows));
          console.log('AUDIT_METADATA=' + JSON.stringify(audit.metadata?.vulnerabilities || {}));
          NODE
