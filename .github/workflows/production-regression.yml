name: PLANES Production Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke test public production shell
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 "https://armidiasintegradas.github.io/planes/?ci=${GITHUB_SHA}" -o /tmp/planes-index.html
          curl -fsSL --retry 3 --retry-delay 2 "https://armidiasintegradas.github.io/planes/auth-gate-live.js?ci=${GITHUB_SHA}" -o /tmp/planes-auth-gate.js
          curl -fsSL --retry 3 --retry-delay 2 "https://armidiasintegradas.github.io/planes/sw.js?ci=${GITHUB_SHA}" -o /tmp/planes-sw.js
          grep -q "Planes" /tmp/planes-index.html
          grep -q "hydratePlanesFromSupabase" /tmp/planes-auth-gate.js
          grep -q "installSecureLogoutBridge" /tmp/planes-auth-gate.js
          grep -q "planes-auth-payload-ready" /tmp/planes-auth-gate.js
          grep -q "applySupabaseAuthPayload" /tmp/planes-index.html
          grep -q "__PLANES_AUTH_INTERNAL_APPLIED__" /tmp/planes-index.html
          grep -q "__PLANES_AUTH_APPLIED_USER_ID__" /tmp/planes-index.html
          ! grep -q "auth-runtime-bridge-live.js" /tmp/planes-index.html
          grep -q "planes-os-v14" /tmp/planes-sw.js
          matched=0
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL --retry 2 --retry-delay 1 "https://armidiasintegradas.github.io/planes/auth-gate-live.js?parity=$attempt" -o /tmp/planes-auth-gate.js
            if cmp --silent public/auth-gate-live.js /tmp/planes-auth-gate.js; then
              matched=1
              break
            fi
            sleep 5
          done
          test "$matched" -eq 1

      - name: Validate authenticated runtime hydration in real browser
        run: node tests/browser-auth-runtime-e2e.mjs

      - name: Diagnose login gate across viewports
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          for size in 390,844 820,1180 1440,900; do
            out="/tmp/planes-$size.html"
            google-chrome \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --virtual-time-budget=15000 \
              --window-size="$size" \
              --dump-dom \
              "https://armidiasintegradas.github.io/planes/?ci=${GITHUB_SHA}&viewport=$size" > "$out"
            echo "VIEWPORT=$size AUTH_ROOT=$(grep -c 'id=\"planes-auth-root\"' "$out" || true) AUTH_CARD=$(grep -c 'planes-auth-card' "$out" || true) LOGIN=$(grep -c 'Entrar no Planes OS' "$out" || true) INIT=$(grep -c 'Inicializando seu ambiente' "$out" || true)"
            grep -Eo '<h1[^>]*>[^<]*|planes-auth-[a-z-]+' "$out" | head -20 || true
            grep -q 'PLANES OS' "$out"
          done

      - name: Run regression tests
        run: npm test

      - name: Report dependency audit
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const rows = Object.entries(audit.vulnerabilities || {}).map(([name, value]) => ({
            name,
            severity: value.severity,
            direct: Boolean(value.isDirect),
            fixAvailable: value.fixAvailable === true
              ? 'yes'
              : value.fixAvailable && typeof value.fixAvailable === 'object'
                ? `${value.fixAvailable.name}@${value.fixAvailable.version}${value.fixAvailable.isSemVerMajor ? ' (major)' : ''}`
                : 'no'
          }));
          console.log('AUDIT_SUMMARY=' + JSON.stringify(rows));
          console.log('AUDIT_METADATA=' + JSON.stringify(audit.metadata?.vulnerabilities || {}));
          NODE
