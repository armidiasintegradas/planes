name: Probe Planes Auth secret availability

on:
  push:
    branches:
      - feat/planes-iam-real
    paths:
      - .github/workflows/probe-auth-secrets.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
      APPLE_SECRET: ${{ secrets.APPLE_SECRET }}
    steps:
      - name: Report only whether expected secrets exist
        run: |
          for name in SUPABASE_ACCESS_TOKEN RESEND_API_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET APPLE_CLIENT_ID APPLE_SECRET; do
            if [ -n "${!name:-}" ]; then echo "$name=SET"; else echo "$name=UNSET"; fi
          done
