name: Resend Planes admin confirmation fixed

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/resend-admin-confirmation-fixed.yml

permissions:
  contents: read

jobs:
  resend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Install Supabase client
        run: npm install --no-save --no-audit --no-fund @supabase/supabase-js@2.95.0

      - name: Resend confirmation email with production redirect
        env:
          SUPABASE_URL: https://xfgcbxppsbwmxwsuajou.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_tFvlFVbpOPYPPA72qcMWQg_IZO4V4xS
          PLANES_ADMIN_EMAIL: armidiasintegradas@gmail.com
          PLANES_REDIRECT_URL: https://armidiasintegradas.github.io/planes/auth-preview.html
        run: |
          node <<'NODE'
          const { createClient } = require('@supabase/supabase-js');
          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_PUBLISHABLE_KEY,
            { auth: { persistSession: false, autoRefreshToken: false } }
          );
          (async () => {
            const { error } = await supabase.auth.resend({
              type: 'signup',
              email: process.env.PLANES_ADMIN_EMAIL,
              options: {
                emailRedirectTo: process.env.PLANES_REDIRECT_URL
              }
            });
            if (error) {
              console.error(`RESEND_FAILED: ${error.message}`);
              process.exit(1);
            }
            console.log('RESEND_OK');
          })();
          NODE
