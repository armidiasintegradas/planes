<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planes Gestão — Japaratinga Resort (Preview)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --navy: #072f46;
      --navy2: #0b405d;
      --blue: #0c6a91;
      --cyan: #36a9cf;
      --gold: #d8a948;
      --paper: #f3f5f6;
      --ink: #17252d;
      --muted: #667780;
      --line: #dce3e7;
      --red: #c94b4b;
      --amber: #c9892f;
      --green: #2c8d65;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #061c2b;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .brand-mark {
      border: 1.5px solid currentColor;
      width: 32px;
      height: 36px;
      display: grid;
      place-items: center;
      font: 700 20px Georgia, serif;
      transform: skew(-5deg);
    }
    .gridline { stroke: #e8edef; stroke-width: 1; fill: none; }
    .planned { stroke: #a8b3b8; stroke-width: 2; stroke-dasharray: 6 5; fill: none; }
    .actual { stroke: var(--blue); stroke-width: 3; fill: none; }
    .flow-1 { stroke: var(--blue); stroke-width: 3; fill: none; }
    .flow-2 { stroke: var(--cyan); stroke-width: 3; fill: none; }
    .flow-real { stroke: var(--red); stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
  </style>
</head>
<body class="p-2 md:p-6 flex flex-col items-center min-h-screen justify-center">

  <!-- Top bar controls for the interactive preview -->
  <div class="w-full max-w-7xl mb-4 bg-slate-900 border border-slate-700 text-white rounded-xl p-3 px-5 flex flex-wrap items-center justify-between gap-4 shadow-xl">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></div>
      <span class="text-xs font-semibold tracking-wider text-cyan-400 uppercase">Ambiente de Demonstração Interativo</span>
      <span class="text-xs text-slate-400">| Obra: Japaratinga Resort – Expansão 3</span>
    </div>
    <div class="flex items-center gap-2 text-xs">
      <span class="text-slate-400">Alternar Perfil:</span>
      <button onclick="switchUser('engenharia')" id="btn-user-eng" class="px-3 py-1.5 rounded-lg bg-cyan-600 text-white font-medium hover:bg-cyan-500 transition">Mariana (Engenharia)</button>
      <button onclick="switchUser('campo')" id="btn-user-campo" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 font-medium hover:bg-slate-700 transition">Carlos (Campo)</button>
      <button onclick="switchUser('diretoria')" id="btn-user-dir" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 font-medium hover:bg-slate-700 transition">Ricardo (Diretoria)</button>
    </div>
  </div>

  <!-- Main App Container -->
  <div class="w-full max-w-7xl bg-[#f3f5f6] rounded-2xl shadow-2xl border border-slate-300 overflow-hidden flex flex-col md:flex-row min-h-[820px]">
    
    <!-- Sidebar -->
    <aside class="w-full md:w-64 bg-[#072f46] text-white flex flex-col shrink-0 border-r border-slate-800">
      <div class="h-20 flex items-center px-6 gap-3 border-b border-white/10">
        <div class="brand-mark text-white">P</div>
        <div>
          <div class="font-bold tracking-wider font-serif text-lg leading-none">PLANES</div>
          <div class="text-[8px] tracking-widest text-cyan-400 mt-1 uppercase font-semibold">Engenharia Inteligente</div>
        </div>
      </div>

      <div class="m-4 p-3 rounded-lg bg-white/5 border border-white/10">
        <span class="text-[9px] font-bold tracking-widest text-cyan-300 uppercase block">Obra Piloto</span>
        <strong class="text-xs text-white block mt-1">Japaratinga Resort</strong>
        <span class="text-[10px] text-slate-300 block">Expansão 3 · Alagoas</span>
      </div>

      <!-- Navigation links -->
      <nav id="nav-list" class="flex-1 px-3 space-y-1 overflow-y-auto">
        <!-- populated dynamically -->
      </nav>

      <!-- Sidebar User Footer -->
      <div class="p-4 border-t border-white/10 flex items-center gap-3 bg-black/20">
        <div id="user-avatar" class="w-8 h-8 rounded-full bg-cyan-200 text-[#072f46] font-bold text-xs flex items-center justify-center">MA</div>
        <div class="min-w-0 flex-1">
          <strong id="user-name" class="text-xs text-white block truncate">Mariana Alves</strong>
          <span id="user-role" class="text-[10px] text-slate-400 block">Engenharia</span>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col min-w-0 bg-[#f3f5f6]">
      <!-- Header -->
      <header class="h-16 bg-white border-b border-[#dce3e7] px-6 flex items-center justify-between sticky top-0 z-10">
        <div class="flex items-center gap-3">
          <span class="text-[10px] font-bold tracking-widest text-[#0c6a91] uppercase">PLANES GESTÃO</span>
          <span class="text-xs font-semibold text-slate-700 border-l border-slate-300 pl-3">Japaratinga Resort – Expansão 3</span>
        </div>
        <div class="flex items-center gap-4">
          <span class="text-xs text-emerald-600 font-medium flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Dados Atualizados
          </span>
          <span class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full border border-slate-200">Semana 34 · 2026</span>
        </div>
      </header>

      <!-- Dynamic Views Container -->
      <div id="view-container" class="flex-1 p-6 md:p-8 overflow-y-auto max-w-6xl w-full mx-auto">
        <!-- Rendered view -->
      </div>
    </main>

  </div>

  <script>

    const USERS = {

      campo: { name: 'Carlos Lima', role: 'Campo', avatar: 'CL', defaultView: 'field' },

    };

    let currentUser = USERS.engenharia;
    let currentView = 'dashboard';

    let activities = [
      { id:'a1', area:'Arena', location:'Quadra coberta', discipline:'Estrutura', name:'Estrutura metálica da coberta', start:'18/05', end:'19/06', progress:75, planned:100, status:'Atenção' },
      { id:'a2', area:'Arena', location:'Apoio quadra', discipline:'Revestimento', name:'Revestimento cerâmico piso e parede (517 m²)', start:'13/07', end:'31/07', progress:35, planned:100, status:'Atrasada' },
      { id:'a3', area:'Arena', location:'Quadra tênis 1', discipline:'Pavimentação', name:'Resina e pintura da quadra', start:'27/07', end:'14/08', progress:100, planned:100, status:'Em dia' },
      { id:'a4', area:'Arena', location:'Área 1', discipline:'Drenagem', name:'Drenagem – tubulações profundas', start:'08/06', end:'19/06', progress:100, planned:100, status:'Em dia' },
      { id:'a5', area:'Bloco de apartamentos', location:'Torre 1 · P1', discipline:'Alvenaria', name:'Elevação de alvenaria Torre 1 P1', start:'27/07', end:'07/08', progress:100, planned:100, status:'Em dia' },
      { id:'a6', area:'Bloco de apartamentos', location:'Torre 1 · P2', discipline:'Alvenaria', name:'Elevação de alvenaria Torre 1 P2', start:'03/08', end:'14/08', progress:62, planned:100, status:'Atenção' },
      { id:'a7', area:'Bloco de apartamentos', location:'Torre 1 · P1', discipline:'Revestimento', name:'Reboco e contramarco Torre 1 P1', start:'10/08', end:'21/08', progress:48, planned:100, status:'Atrasada' },
      { id:'a8', area:'Bloco de apartamentos', location:'Torre 2 · Térreo', discipline:'Estrutura', name:'Cintas e pilares do térreo', start:'03/08', end:'28/08', progress:54, planned:70, status:'Atenção' },
      { id:'a9', area:'Bloco de apartamentos', location:'Torre 3 · Fundações', discipline:'Fundações', name:'Sapatas Torre 3', start:'13/07', end:'07/08', progress:100, planned:100, status:'Em dia' },
      { id:'a10', area:'Infraestrutura', location:'Área 1', discipline:'Elétrica', name:'Infra de alimentadores Área 1', start:'08/06', end:'26/06', progress:50, planned:100, status:'Atrasada' },
      { id:'a11', area:'Infraestrutura', location:'Área 1', discipline:'Hidrossanitária', name:'Infra de água Área 1', start:'22/06', end:'10/07', progress:75, planned:100, status:'Atenção' },
      { id:'a12', area:'Infraestrutura', location:'Área 1', discipline:'Esgoto', name:'Infra de esgoto Área 1', start:'29/06', end:'17/07', progress:50, planned:100, status:'Atrasada' },
      { id:'a13', area:'Recepção e restaurante', location:'Recepção', discipline:'Acabamentos', name:'Forro ripado', start:'17/08', end:'04/09', progress:30, planned:50, status:'Atenção' },
      { id:'a14', area:'Recepção e restaurante', location:'SPA e lojas', discipline:'Instalações', name:'Acabamentos elétricos e luminárias', start:'10/08', end:'28/08', progress:42, planned:60, status:'Atenção' },
      { id:'a15', area:'Área da piscina', location:'Piscina', discipline:'Estrutura', name:'Estrutura e impermeabilização da piscina', start:'01/06', end:'31/07', progress:88, planned:100, status:'Atrasada' },
      { id:'a16', area:'Área da piscina', location:'Deck seco', discipline:'Paisagismo', name:'Obras em madeira', start:'17/08', end:'18/09', progress:10, planned:20, status:'Em dia' }
    ];

    let constraints = [
      { id:'r1', type:'Projeto', title:'Refrigeração – provável alteração', owner:'Projetos', due:'18/08/2026', area:'Arena', status:'Vencida' },
      { id:'r2', type:'Orçamento', title:'Estouro do orçamento – Apoio Quadra', owner:'Suprimentos', due:'21/08/2026', area:'Arena', status:'Em tratamento' },
      { id:'r3', type:'Escopo', title:'Definição de escopo Arante', owner:'Engenharia', due:'24/08/2026', area:'Recepção e restaurante', status:'Aberta' },
      { id:'r4', type:'Mão de obra', title:'Reforço da equipe de alvenaria Torre 1', owner:'Produção', due:'28/08/2026', area:'Bloco de apartamentos', status:'Em tratamento' }
    ];

    let entries = [
      { id:'e1', activityId:'a6', quantity:15, kind:'Produção', note:'Executado 15m² de alvenaria no 2º pavimento', status:'Pendente', date:'21/08/2026' },
      { id:'e2', activityId:'a7', quantity:8, kind:'Produção', note:'Reboco iniciado no dormitório 102', status:'Pendente', date:'21/08/2026' }
    ];

    const NAV_ITEMS = [
      { id: 'dashboard', label: 'Painel Executivo', icon: '◫', roles: ['Engenharia', 'Diretoria'] },
      { id: 'field', label: 'Minha Obra (Campo)', icon: '⌂', roles: ['Campo', 'Engenharia'] },
      { id: 'validation', label: 'Validações', icon: '◉', roles: ['Engenharia'], badgeKey: 'pending' },
      { id: 'gantt', label: 'Cronograma Gantt', icon: '▥', roles: ['Engenharia', 'Diretoria'] },
      { id: 'balance', label: 'Linha de Balanço', icon: '⌁', roles: ['Engenharia', 'Diretoria'] },
      { id: 'lookahead', label: 'Lookahead', icon: '◷', roles: ['Engenharia', 'Campo'] },
      { id: 'weekly', label: 'Plano Semanal', icon: '✓', roles: ['Engenharia', 'Campo', 'Diretoria'] },
      { id: 'constraints', label: 'Restrições', icon: '△', roles: ['Engenharia', 'Campo', 'Diretoria'] },
      { id: 'estrutura', label: 'Estrutura da Obra', icon: '⌘', roles: ['Engenharia', 'Diretoria'] }
    ];

    function switchUser(key) {
      currentUser = USERS[key];
      ['eng', 'campo', 'dir'].forEach(k => {
        const btn = document.getElementById('btn-user-' + k);
        if (k === (key === 'engenharia' ? 'eng' : key)) {
          btn.className = 'px-3 py-1.5 rounded-lg bg-cyan-600 text-white font-medium hover:bg-cyan-500 transition shadow-sm';
        } else {
          btn.className = 'px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 font-medium hover:bg-slate-700 transition';
        }
      });
      document.getElementById('user-avatar').innerText = currentUser.avatar;
      document.getElementById('user-name').innerText = currentUser.name;
      document.getElementById('user-role').innerText = currentUser.role;

      // Select allowed view
      const allowed = NAV_ITEMS.filter(n => n.roles.includes(currentUser.role));
      if (!allowed.some(n => n.id === currentView)) {
        currentView = currentUser.defaultView;
      }
      renderNav();
      renderCurrentView();
    }

    function renderNav() {
      const navEl = document.getElementById('nav-list');
      const allowed = NAV_ITEMS.filter(n => n.roles.includes(currentUser.role));
      const pendingCount = entries.filter(e => e.status === 'Pendente').length;

      navEl.innerHTML = allowed.map(item => {
        const isActive = currentView === item.id;
        const activeClass = isActive ? 'bg-white/15 text-white shadow-inner font-semibold border-l-4 border-cyan-400' : 'text-slate-300 hover:bg-white/5 hover:text-white';
        const badge = item.badgeKey === 'pending' && pendingCount > 0 
          ? `<span class="ml-auto bg-[#d8a948] text-[#072f46] text-[10px] font-bold px-2 py-0.5 rounded-full">${pendingCount}</span>` 
          : '';

        return `
          <button onclick="changeView('${item.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-md text-xs transition text-left ${activeClass}">
            <span class="text-base w-5 text-center">${item.icon}</span>
            <span>${item.label}</span>
            ${badge}
          </button>
        `;
      }).join('');
    }

    function changeView(viewId) {
      currentView = viewId;
      renderNav();
      renderCurrentView();
    }

    function renderCurrentView() {
      const container = document.getElementById('view-container');
      if (currentView === 'dashboard') container.innerHTML = viewDashboard();
      else if (currentView === 'field') container.innerHTML = viewField();
      else if (currentView === 'validation') container.innerHTML = viewValidation();
      else if (currentView === 'gantt') container.innerHTML = viewGantt();
      else if (currentView === 'balance') container.innerHTML = viewBalance();
      else if (currentView === 'lookahead') container.innerHTML = viewLookahead();
      else if (currentView === 'weekly') container.innerHTML = viewWeekly();
      else if (currentView === 'constraints') container.innerHTML = viewConstraints();
      else if (currentView === 'estrutura') container.innerHTML = viewStructure();
    }

    /* Views */
    function viewDashboard() {
      const pendingCount = entries.filter(e => e.status === 'Pendente').length;
      return `
        <div>
          <div class="flex flex-col md:flex-row md:items-end justify-between mb-6 gap-3">
            <div>
              <span class="text-[10px] font-bold tracking-widest text-[#0c6a91] uppercase">VISÃO EXECUTIVA</span>
              <h1 class="font-serif text-2xl md:text-3xl text-[#072f46] font-semibold mt-1">Painel Planes</h1>
            </div>
            <div class="text-xs bg-white border border-[#dce3e7] rounded-lg px-3 py-2 text-slate-600 font-medium">
              Semana 34 · 17–21 ago 2026
            </div>
          </div>

          <!-- Alert summary strip -->
          <div class="bg-[#072f46] text-white p-4 rounded-xl flex flex-col md:flex-row items-start md:items-center justify-between gap-4 mb-6 shadow-md">
            <div class="flex items-center gap-3">
              <span class="text-[9px] uppercase tracking-wider text-slate-300 font-bold">STATUS DA OBRA</span>
              <span class="bg-amber-100 text-amber-900 text-[10px] font-bold px-2.5 py-1 rounded-full">● Atenção</span>
            </div>
            <p class="text-xs text-slate-200 m-0">Ritmo abaixo do planejado em <strong>Bloco de Apartamentos</strong> e <strong>Área da Piscina</strong>. 4 restrições exigem decisão.</p>
            <span class="text-[10px] text-slate-400">Última consolidação: 21/08/2026</span>
          </div>

          <!-- KPI Cards -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-5 rounded-xl border border-[#dce3e7] shadow-sm">
              <div class="flex justify-between text-xs text-slate-500 font-medium">
                <span>Avanço Físico</span>
                <span class="text-slate-400">↗</span>
              </div>
              <div class="font-serif text-3xl text-[#072f46] font-bold my-2">61,8%</div>
              <div class="text-[11px] text-slate-500">Planejado: 66,4%</div>
              <div class="mt-3 pt-2 border-t border-slate-100 text-[11px] text-rose-600 font-semibold">-4,6 p.p. de desvio</div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-[#dce3e7] shadow-sm">
              <div class="flex justify-between text-xs text-slate-500 font-medium">
                <span>Aderência Semanal</span>
                <span class="text-slate-400">↗</span>
              </div>
              <div class="font-serif text-3xl text-[#072f46] font-bold my-2">78%</div>
              <div class="text-[11px] text-slate-500">18 de 23 compromissos</div>
              <div class="mt-3 pt-2 border-t border-slate-100 text-[11px] text-emerald-600 font-semibold">+6 p.p. vs semana anterior</div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-[#dce3e7] shadow-sm">
              <div class="flex justify-between text-xs text-slate-500 font-medium">
                <span>Variação de Prazo</span>
                <span class="text-slate-400">↗</span>
              </div>
              <div class="font-serif text-3xl text-[#072f46] font-bold my-2">+18 dias</div>
              <div class="text-[11px] text-slate-500">Baseline: 30/11/2026</div>
              <div class="mt-3 pt-2 border-t border-slate-100 text-[11px] text-amber-600 font-semibold">Tendência: 18/12/2026</div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-[#dce3e7] shadow-sm">
              <div class="flex justify-between text-xs text-slate-500 font-medium">
                <span>Restrições Abertas</span>
                <span class="text-slate-400">↗</span>
              </div>
              <div class="font-serif text-3xl text-[#072f46] font-bold my-2">12</div>
              <div class="text-[11px] text-slate-500">4 vencidas · 5 críticas</div>
              <div class="mt-3 pt-2 border-t border-slate-100 text-[11px] text-amber-600 font-semibold">3 liberadas esta semana</div>
            </div>
          </div>

          <!-- Charts Row -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
            <!-- Curve S -->
            <div class="lg:col-span-2 bg-white p-5 rounded-xl border border-[#dce3e7] shadow-sm">
              <div class="flex justify-between items-center mb-4">
                <div>
                  <span class="text-[9px] font-bold tracking-wider text-slate-400 uppercase">CURVA DE AVANÇO</span>
                  <h3 class="font-serif text-lg text-[#072f46] font-semibold">Planejado × Realizado</h3>
                </div>
                <span class="bg-slate-100 text-slate-700 text-[10px] font-bold px-2.5 py-1 rounded-md">Físico Ponderado</span>
              </div>
              
              <div class="h-48 relative">
                <svg viewBox="0 0 700 200" preserveAspectRatio="none" class="w-full h-44 overflow-visible">
                  <path class="gridline" d="M0 40H700M0 80H700M0 120H700M0 160H700"/>
                  <path class="planned" d="M0 190 C120 185 120 170 210 155 S350 110 430 85 S570 40 700 15"/>
                  <path class="actual" d="M0 190 C120 188 140 175 220 162 S350 125 430 108 S570 70 700 55"/>
                  <circle cx="700" cy="55" r="5"/>
                </svg>
                <div class="flex justify-between text-[10px] text-slate-400 mt-2 px-1">
                  <span>Mar</span><span>Abr</span><span>Mai</span><span>Jun</span><span>Jul</span><span>Ago</span><span>Set</span><span>Out</span><span>Nov</span>

              </div>

              <div class="flex items-center gap-6 mt-4 pt-3 border-t border-slate-100 text-xs text-slate-600">
                <span class="flex items-center gap-2"><span class="w-4 h-0.5 border-t-2 border-dashed border-slate-400"></span> Planejado 66,4%</span>
                <span class="flex items-center gap-2"><span class="w-4 h-0.5 bg-[#0c6a91]"></span> Realizado 61,8%</span>
              </div>
            </div>

            <!-- Priority Attention List -->
            <div class="bg-white p-5 rounded-xl border border-[#dce3e7] shadow-sm flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-center mb-3">
                  <span class="text-[9px] font-bold tracking-wider text-slate-400 uppercase">PRIORIDADE</span>
                  <button onclick="changeView('constraints')" class="text-xs text-[#0c6a91] font-semibold hover:underline">Ver todas →</button>
                </div>
                <h3 class="font-serif text-lg text-[#072f46] font-semibold mb-3">Atenções para Decisão</h3>

                <div class="space-y-3">
                  <div class="p-3 rounded-lg bg-rose-50 border border-rose-100 flex items-start gap-3">
                    <span class="w-6 h-6 rounded-full bg-rose-200 text-rose-800 text-xs font-bold flex items-center justify-center shrink-0">01</span>
                    <div class="text-xs">
                      <strong class="text-rose-950 block font-semibold">Refrigeração – alteração de projeto</strong>
                      <span class="text-rose-700 text-[10px]">Arena · Resp: Projetos · Vencida</span>
                    </div>
                  </div>

                  <div class="p-3 rounded-lg bg-amber-50 border border-amber-100 flex items-start gap-3">
                    <span class="w-6 h-6 rounded-full bg-amber-200 text-amber-800 text-xs font-bold flex items-center justify-center shrink-0">02</span>
                    <div class="text-xs">
                      <strong class="text-amber-950 block font-semibold">Estouro orçamentário Apoio Quadra</strong>
                      <span class="text-amber-700 text-[10px]">Arena · Resp: Suprimentos</span>
                    </div>
                  </div>

                  <div class="p-3 rounded-lg bg-amber-50 border border-amber-100 flex items-start gap-3">
                    <span class="w-6 h-6 rounded-full bg-amber-200 text-amber-800 text-xs font-bold flex items-center justify-center shrink-0">03</span>
                    <div class="text-xs">
                      <strong class="text-amber-950 block font-semibold">Mão de obra Alvenaria Torre 1</strong>
                      <span class="text-amber-700 text-[10px]">Bloco Aptos · Resp: Produção</span>
                    </div>
                  </div>
                </div>
              </div>

              ${pendingCount > 0 ? `
                <div class="mt-4 p-3 bg-cyan-50 border border-cyan-200 rounded-lg flex items-center justify-between text-xs">
                  <span class="text-cyan-950"><strong>${pendingCount}</strong> apontamentos na fila de validação</span>
                  <button onclick="changeView('validation')" class="font-bold text-[#0c6a91] hover:underline">Revisar →</button>
                </div>
              ` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function viewField() {
      return `
        <div>

    function openEntryModal(kind, defaultActId) {
      const actId = defaultActId || activities[0].id;
      const act = activities.find(a => a.id === actId);
      const qty = prompt(`[Apontamento de ${kind}]\nAtividade: ${act.name}\n\nInforme a quantidade executada ou descrição:`, '10');
      if (qty) {
        entries.unshift({
          id: 'e' + Date.now(),
          activityId: actId,
          quantity: parseFloat(qty) || 1,
          kind: kind,
          note: `Apontamento via prévia interativa (${kind})`,
          status: 'Pendente',
          date: 'Hoje'
        });
        alert(`✓ Apontamento de ${kind} enviado com sucesso para validação da Engenharia!`);
        renderNav();
        renderCurrentView();
      }
    }

    // Initialize
    switchUser('engenharia');
  </script>
</body>
