<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Influency Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-outer: #e6ebf0;
      --bg-canvas: #f2f5f8;
      --card-white: #ffffff;
      --lime-neon: #d4ff00;
      --soft-blue: #8eb3ff;
      --text-dark: #111827;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 10% 20%, #f7f9fb 0%, #e5eaf0 90%);
      color: var(--text-dark);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    .dashboard-main-frame {
      background: #f4f6f9;
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.7);
      border-radius: 2rem;
    }
    .stat-display-number {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1;
    }
    .display-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      letter-spacing: -0.025em;
    }
    .brand-logo-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      letter-spacing: 0.12em;
    }
    .white-bento-card {
      background: #ffffff;
      border-radius: 1.5rem;
      box-shadow: 0 4px 20px -2px rgba(17, 24, 39, 0.025);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .white-bento-card:hover {
      box-shadow: 0 12px 28px -6px rgba(17, 24, 39, 0.055);
    }
    .lime-bento-card {
      background: linear-gradient(140deg, #e4ff3a 0%, #d4ff00 55%, #c0f400 100%);
      border-radius: 1.5rem;
      box-shadow: 0 14px 32px -8px rgba(190, 242, 0, 0.45);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .lime-bento-card:hover {
      box-shadow: 0 18px 38px -6px rgba(190, 242, 0, 0.6);
      transform: translateY(-2px);
    }
    .speech-bubble {
      position: relative;
      background: #000000;
      color: #ffffff;
      border-radius: 0.75rem;
      padding: 0.4rem 0.8rem;
      box-shadow: 0 12px 28px -4px rgba(0, 0, 0, 0.35);
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid #000000;
    }
    .icon-circle-btn {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 9999px;
      border: 1px solid #e5e7eb;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111827;
      transition: all 0.2s ease;
    }
    .icon-circle-btn:hover {
      background: #f9fafb;
      border-color: #d1d5db;
      transform: scale(1.04);
    }
    .nav-pill-active {
      background: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      color: #111827;
      font-weight: 600;
    }
    .nav-pill-inactive { color: #6b7280; }
    .nav-pill-inactive:hover { color: #111827; background: rgba(255, 255, 255, 0.5); }
  </style>
</head>
<body class="p-4 md:p-8 flex items-center justify-center">

  <div id="app" class="w-full max-w-[1280px]"></div>

  <div id="upgrade-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border border-slate-100 text-center">
      <div class="w-12 h-12 rounded-full bg-[#d4ff00] flex items-center justify-center text-xl mx-auto mb-3">👑</div>
      <h3 class="text-lg font-bold text-slate-900">Upgrade to Influency Pro</h3>
      <p class="text-xs text-slate-500 my-2">Get unlimited real-time donator analytics, custom exports, and automated campaign tracking.</p>
      <div class="my-4 p-3 bg-slate-50 rounded-2xl border border-slate-100">
        <span class="text-2xl font-black text-slate-900">$10</span>
        <span class="text-xs text-slate-500"> / month</span>
      </div>
      <div class="flex gap-2">
        <button onclick="closeUpgradeModal()" class="flex-1 py-2.5 rounded-full border border-slate-200 text-xs font-semibold text-slate-700 hover:bg-slate-50">Cancel</button>
        <button onclick="confirmUpgrade()" class="flex-1 py-2.5 rounded-full bg-slate-950 text-white text-xs font-semibold hover:bg-slate-800">Confirm $10</button>
      </div>
    </div>
  </div>

  <script>
    let activeNav = 'Donators';
    let selectedMonth = 'Jun';

    const barChartData = [
      { month: 'May', blue: 36, lime: 72, value: '$68,400' },
      { month: 'Jun', blue: 64, lime: 75, value: '$75,200', date: 'Jun 2023' },
      { month: 'Jul', blue: 38, lime: 50, value: '$52,100' },
      { month: 'Aug', blue: 60, lime: 70, value: '$71,800' },
      { month: 'Sep', blue: 70, lime: 82, value: '$84,500' },
    ];

    function setNav(item) {
      activeNav = item;
      render();
    }

    function setMonth(m) {
      selectedMonth = m;
      render();
    }

    function openUpgradeModal() {
      document.getElementById('upgrade-modal').classList.remove('hidden');
    }

    function closeUpgradeModal() {
      document.getElementById('upgrade-modal').classList.add('hidden');
    }

    function confirmUpgrade() {
      closeUpgradeModal();
      alert('Upgrade to Influency Pro successful!');
    }

    function render() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="dashboard-main-frame min-h-[780px] p-5 md:p-7 flex flex-col lg:flex-row gap-6 relative">
          
          <!-- LEFT SIDEBAR -->
          <aside class="w-full lg:w-60 flex flex-col justify-between shrink-0">
            <div>
              <!-- Logo -->
              <div class="flex items-center gap-3 px-3 py-2 mb-8">
                <div class="w-8 h-8 rounded-full border-2 border-slate-900 flex items-center justify-center font-bold text-slate-900 text-sm">
                  <svg viewBox="0 0 24 24" class="w-4 h-4 fill-current">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z" />
                  </svg>
                </div>
                <span class="brand-logo-text text-[15px] text-slate-900">INFLUENCY</span>
              </div>

              <!-- Nav Items -->
              <nav class="space-y-1.5">
                ${[
                  { name: 'Home', icon: '⌂' },
                  { name: 'Post', icon: '▤' },
                  { name: 'Donators', icon: '◻', badge: 2 },
                  { name: 'Page', icon: '▢' },
                  { name: 'Messages', icon: '💬', badge: 6 },
                  { name: 'Statistic', icon: '◫' },
                ].map(item => `
                  <button
                    onclick="setNav('${item.name}')"
                    class="w-full flex items-center justify-between px-4 py-3 rounded-2xl text-[14px] transition text-left ${activeNav === item.name ? 'nav-pill-active' : 'nav-pill-inactive'}"
                  >
                    <div class="flex items-center gap-3.5">
                      <span class="text-base text-slate-400 w-5 text-center">${item.icon}</span>
                      <span class="font-semibold text-[13.5px]">${item.name}</span>
                    </div>
                    ${item.badge ? `<span class="w-5 h-5 rounded-full bg-[#5d87ff] text-white text-[11px] font-bold flex items-center justify-center">${item.badge}</span>` : ''}
                  </button>
                `).join('')}
              </nav>
            </div>

            <!-- Upgrade to Pro Card -->
            <div class="white-bento-card p-5 mt-8 border border-slate-100 relative">
              <div class="w-10 h-10 rounded-full bg-[#d4ff00] flex items-center justify-center text-slate-900 font-bold mb-3.5 shadow-2xs">
                <span class="text-base">👑</span>
              </div>
              <h4 class="font-bold text-slate-900 text-[14px] tracking-tight mb-1">Upgrade to Pro</h4>
              <p class="text-slate-400 text-[12px] font-medium leading-relaxed mb-4">Discover the benefits of an upgraded account</p>
              <button
                onclick="openUpgradeModal()"
                class="w-full py-2.5 bg-slate-950 hover:bg-slate-800 text-white text-[12px] font-semibold rounded-full transition shadow-xs"

                Upgrade $10
              </button>
            </div>
          </aside>

          <!-- RIGHT DASHBOARD CONTENT -->
          <div class="flex-1 flex flex-col gap-6">
            
            <!-- Header -->
            <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <div class="flex items-center gap-3">
                  <h1 class="display-title text-[28px] text-slate-900 leading-none">Donators</h1>
                  <span class="bg-[#8eb3ff] text-slate-900 text-[12px] font-bold px-3 py-1 rounded-full tracking-tight">2 New</span>
                </div>

              </div>

              <!-- Controls -->
              <div class="flex items-center gap-3">
                <button class="icon-circle-btn shadow-2xs" title="Search">
                  <svg class="w-4 h-4 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                  </svg>

                <button class="icon-circle-btn relative shadow-2xs" title="Notifications">
                  <svg class="w-4 h-4 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                  </svg>
                  <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-rose-500 ring-2 ring-white"></span>
                </button>

                <div class="flex items-center gap-2.5 bg-white border border-slate-200/80 rounded-full pl-1.5 pr-3 py-1 shadow-2xs cursor-pointer hover:border-slate-300 transition">
                  <div class="w-7 h-7 rounded-full bg-slate-200 overflow-hidden shrink-0">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Andrew Johnson" class="w-full h-full object-cover" />
                  </div>
                  <div class="text-left hidden sm:block">
                    <span class="text-[10.5px] text-slate-400 block leading-tight font-medium">Welcome back</span>
                    <strong class="text-[12.5px] text-slate-900 block font-bold leading-tight">Andrew Johnson</strong>
                  </div>
                  <span class="text-[10px] text-slate-400 ml-0.5">∨</span>
                </div>
              </div>
            </header>

            <!-- 4 Top KPI Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
              
              <!-- Card 1: Lime Neon -->
              <div class="lime-bento-card p-5 flex flex-col justify-between min-h-[148px]">
                <div class="flex items-center justify-between">
                  <div class="w-9 h-9 rounded-full bg-white/90 flex items-center justify-center text-slate-900 shadow-2xs">
                    <span class="text-sm">💵</span>
                  </div>
                  <button class="w-9 h-9 rounded-full border border-slate-900/15 hover:bg-black/5 flex items-center justify-center text-slate-900 font-bold transition">
                    ↗
                  </button>
                </div>
                <div>
                  <div class="stat-display-number text-[30px] text-slate-950 mb-1">
                    $740.89
                  </div>
                  <span class="text-slate-800 text-[12px] font-medium">In this month</span>
                </div>
              </div>

              <!-- Card 2: Active Donation Goals -->
              <div class="white-bento-card p-5 flex flex-col justify-between min-h-[148px] border border-slate-100">
                <div class="flex items-center justify-between">
                  <div class="w-9 h-9 rounded-full bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-700">
                    <span class="text-sm">👑</span>
                  </div>
                  <button class="w-9 h-9 rounded-full border border-slate-200 hover:bg-slate-50 flex items-center justify-center text-slate-700 font-bold transition">
                    ↗
                  </button>
                </div>
                <div>
                  <div class="flex items-baseline gap-1.5 mb-1">
                    <span class="stat-display-number text-[30px] text-slate-900">80%</span>
                    <span class="text-slate-400 text-[12.5px] font-medium">$800 of $1000</span>
                  </div>
                  <span class="text-slate-400 text-[12px] font-medium">Active Donation Goals</span>
                </div>
              </div>

              <!-- Card 3: In this month +8 -->
              <div class="white-bento-card p-5 flex flex-col justify-between min-h-[148px] border border-slate-100">
                <div class="flex items-center justify-between">
                  <div class="w-9 h-9 rounded-full bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-700">
                    <span class="text-sm">👥</span>
                  </div>
                  <button class="w-9 h-9 rounded-full border border-slate-200 hover:bg-slate-50 flex items-center justify-center text-slate-700 font-bold transition">
                    ↗
                  </button>
                </div>
                <div>
                  <div class="flex items-center gap-1.5 mb-1">
                    <span class="stat-display-number text-[30px] text-slate-900">38</span>
                    <span class="bg-[#8eb3ff] text-slate-900 text-[11px] font-bold px-2 py-0.5 rounded-full">+8</span>
                  </div>
                  <span class="text-slate-400 text-[12px] font-medium">In this month</span>
                </div>
              </div>

              <!-- Card 4: For all time -->
              <div class="white-bento-card p-5 flex flex-col justify-between min-h-[148px] border border-slate-100">
                <div class="flex items-center justify-between">
                  <div class="w-9 h-9 rounded-full bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-700">
                    <span class="text-sm">👛</span>
                  </div>
                  <button class="w-9 h-9 rounded-full border border-slate-200 hover:bg-slate-50 flex items-center justify-center text-slate-700 font-bold transition">
                    ↗
                  </button>
                </div>
                <div>
                  <div class="stat-display-number text-[30px] text-slate-900 mb-1">
                    $8,234.19
                  </div>
                  <span class="text-slate-400 text-[12px] font-medium">For all time</span>
                </div>
              </div>

            </div>

            <!-- Middle Row: Statistics + Visitors -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
              
              <!-- Left: Statistics -->
              <div class="lg:col-span-7 xl:col-span-8 white-bento-card p-6 border border-slate-100 flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-2.5">
                      <div class="w-8 h-8 rounded-full bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-700 text-xs">
                        📊
                      </div>
                      <h3 class="text-[17px] font-bold text-slate-900 tracking-tight">Statistics</h3>
                    </div>

                    <div class="flex items-center gap-2">
                      <div class="bg-slate-100 p-0.5 rounded-full flex border border-slate-200/60">
                        <button class="px-3.5 py-1 text-xs font-semibold rounded-full bg-white text-slate-900 shadow-2xs">
                          Monthly
                        </button>
                      </div>
                      <button class="w-7 h-7 rounded-full border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-50">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                        </svg>
                      </button>
                    </div>
                  </div>

                  <div class="grid grid-cols-2 gap-4 pb-6 border-b border-slate-100 mb-6">
                    <div>
                      <span class="text-[12px] text-slate-400 block font-medium">Income</span>
                      <div class="stat-display-number text-[26px] text-slate-900 my-1">$150.09</div>
                      <span class="text-[11.5px] text-emerald-600 font-semibold flex items-center gap-1">
                        <span>↗ 4,1%</span>
                        <span class="text-slate-400 font-normal">vs 143,938 Last Year</span>
                      </span>
                    </div>

                    <div class="border-l border-slate-100 pl-4">
                      <span class="text-[12px] text-slate-400 block font-medium">Spend</span>
                      <div class="stat-display-number text-[26px] text-slate-900 my-1">$90.23</div>
                      <span class="text-[11.5px] text-emerald-600 font-semibold flex items-center gap-1">
                        <span>↗ 2%</span>
                        <span class="text-slate-400 font-normal">vs 82,203 Last Year</span>
                      </span>
                    </div>
                  </div>
                </div>

                <div class="h-56 relative flex flex-col justify-end pt-8">
                  <div class="absolute inset-0 flex flex-col justify-between pointer-events-none text-[11px] text-slate-300 font-medium">
                    <div class="border-b border-slate-100/60 pb-1">$100</div>
                    <div class="border-b border-slate-100/60 pb-1">$75</div>
                    <div class="border-b border-slate-100/60 pb-1">$50</div>
                    <div class="border-b border-slate-100/60 pb-1">$25</div>
                    <div>$10</div>
                  </div>

                  <div class="relative z-10 flex justify-between items-end h-44 px-4 sm:px-8">
                    ${barChartData.map(item => `
                      <div onclick="setMonth('${item.month}')" class="flex flex-col items-center gap-2 group cursor-pointer">
                        <div class="flex items-end gap-1.5 h-36 relative">
                          ${selectedMonth === item.month ? `
                            <div class="absolute -top-12 left-1/2 -translate-x-1/2 z-20 whitespace-nowrap">
                              <div class="speech-bubble text-[12px] font-extrabold text-center">
                                <div>${item.value}</div>
                                <div class="text-[9.5px] text-slate-300 font-normal">${item.date || item.month + ' 2023'}</div>
                              </div>
                              <div class="w-2 h-2 rounded-full bg-slate-950 mx-auto -mt-1 ring-2 ring-white"></div>
                            </div>
                          ` : ''}

                          <div style="height: ${item.blue}%" class="w-4 sm:w-5 bg-[#8eb3ff] rounded-t-full group-hover:brightness-95 transition-all"></div>
                          <div style="height: ${item.lime}%" class="w-4 sm:w-5 bg-[#d4ff00] rounded-t-full group-hover:brightness-95 transition-all"></div>
                        </div>
                        <span class="text-[12px] transition ${selectedMonth === item.month ? 'font-bold text-slate-900' : 'text-slate-400 font-medium'}">
                          ${item.month}
                        </span>
                      </div>
                    `).join('')}
                  </div>
                </div>
              </div>

              <!-- Right: Visitors -->
              <div class="lg:col-span-5 xl:col-span-4 white-bento-card p-6 border border-slate-100 flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2.5">
                      <div class="w-8 h-8 rounded-full bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-700 text-xs">
                        👤
                      </div>
                      <h3 class="text-[17px] font-bold text-slate-900 tracking-tight">Visitors</h3>
                    </div>

                    <button class="flex items-center gap-1.5 px-3 py-1 rounded-full border border-slate-200 text-xs font-medium text-slate-700 hover:bg-slate-50">
                      <span>This Month</span>
                      <span class="text-[10px]">∨</span>
                    </button>
                  </div>

                  <div class="relative h-44 my-4 flex items-center justify-center">
                    <div class="absolute left-6 top-2 w-32 h-32 rounded-full bg-[#d4ff00] flex flex-col items-center justify-center text-slate-950 shadow-sm z-10 hover:scale-105 transition-transform">
                      <span class="text-[27px] font-black tracking-[-0.04em] leading-none">2,3k</span>
                      <span class="text-[11.5px] font-semibold text-slate-800 mt-0.5">Individual</span>
                    </div>

                    <div class="absolute right-6 top-8 w-28 h-28 rounded-full bg-[#8eb3ff] flex flex-col items-center justify-center text-slate-950 shadow-sm z-0 hover:scale-105 transition-transform">
                      <span class="text-[23px] font-black tracking-[-0.035em] leading-none">1,2k</span>
                      <span class="text-[11.5px] font-semibold text-slate-800 mt-0.5">Corporate</span>
                    </div>

                    <div class="absolute left-24 bottom-1 w-20 h-20 rounded-full bg-[#f1efea] border border-slate-200/60 flex flex-col items-center justify-center text-slate-900 shadow-sm z-20 hover:scale-105 transition-transform">
                      <span class="text-[15px] font-extrabold tracking-[-0.02em] leading-none">982</span>
                      <span class="text-[10px] font-medium text-slate-600 mt-0.5">Foundation</span>
                    </div>
                  </div>
                </div>

                <div class="space-y-3.5 pt-4 border-t border-slate-100">
                  <div>
                    <div class="flex justify-between text-[12.5px] mb-1.5">
                      <span class="text-[#4b5563] font-medium">Individual Target</span>
                      <span class="text-slate-900 font-bold">92%</span>
                    </div>
                    <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                      <div class="h-full bg-[#d4ff00] rounded-full" style="width: 92%"></div>
                    </div>
                  </div>

                  <div>
                    <div class="flex justify-between text-[12.5px] mb-1.5">
                      <span class="text-[#4b5563] font-medium">Corporate Target</span>
